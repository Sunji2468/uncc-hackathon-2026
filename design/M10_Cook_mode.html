<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Cook mode</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#12201B;font-family:'DM Sans',system-ui,sans-serif;color:#F4EFE6}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;margin:0}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #FFD54A;outline-offset:3px}
</style>
</helmet>

<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#12201B">

<div style="position:absolute;left:0;right:0;top:0;padding:20px 16px 0;display:flex;align-items:center;justify-content:space-between">
<a href="Sticker.dc.html" aria-label="Exit cook mode" style="width:48px;height:48px;border-radius:50%;background:#1B2D26;border:2px solid #2E4439;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<p style="font-weight:700;font-size:16px">Step 2 of 3</p>
<div style="width:48px"></div>
</div>

<div style="position:absolute;left:20px;right:20px;top:90px;display:flex;gap:8px">
<span style="flex:1;height:8px;border-radius:4px;background:#FFD54A"></span>
<span style="flex:1;height:8px;border-radius:4px;background:#FFD54A"></span>
<span style="flex:1;height:8px;border-radius:4px;background:#2E4439"></span>
</div>

<h1 style="position:absolute;left:20px;right:20px;top:130px;font-size:34px;font-weight:800;letter-spacing:-0.9px;line-height:1.12">Boil the spaghetti two minutes short of the box time, then move it into the pan.</h1>

<div style="position:absolute;left:20px;right:20px;top:352px">
<p style="font-size:13px;font-weight:700;color:#FFD54A">You need for this step</p>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
<span style="padding:8px 14px;border-radius:999px;background:#F4EFE6;color:#12201B;font-weight:700;font-size:15px">Spaghetti 200 g</span>
<span style="padding:8px 14px;border-radius:999px;background:#F4EFE6;color:#12201B;font-weight:700;font-size:15px">Pasta water 120 ml</span>
</div>
</div>

<div style="position:absolute;left:0;right:0;top:446px;display:flex;flex-direction:column;align-items:center">
<div style="position:relative;width:200px;height:200px">
<svg width="200" height="200" sc-camel-view-box="0 0 200 200" role="img" aria-label="Timer showing 2 minutes remaining">
<circle cx="100" cy="100" r="88" fill="none" stroke="#2E4439" stroke-width="12"></circle>
<circle cx="100" cy="100" r="88" fill="none" stroke="#FF5A36" stroke-width="12" stroke-linecap="round" stroke-dasharray="368 553" transform="rotate(-90 100 100)"></circle>
</svg>
<div style="position:absolute;left:0;top:0;width:200px;height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center">
<p style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:52px;line-height:1">02:00</p>
<p style="font-size:14px;color:#B8C5BD;margin-top:4px">Ready to start</p>
</div>
</div>
<div style="display:flex;gap:10px;margin-top:20px">
<button style="min-height:52px;padding:0 32px;border-radius:999px;border:0;background:#FF5A36;color:#12201B;font-weight:700;font-size:17px">Start timer</button>
<button style="min-height:52px;padding:0 24px;border-radius:999px;border:2px solid #F4EFE6;background:transparent;color:#F4EFE6;font-weight:700;font-size:17px">Reset</button>
</div>
</div>

<div style="position:absolute;left:16px;right:16px;bottom:24px;display:flex;gap:10px">
<button style="flex:1;min-height:60px;border-radius:18px;border:2px solid #F4EFE6;background:transparent;color:#F4EFE6;font-weight:700;font-size:17px">Previous</button>
<button style="flex:1.4;min-height:60px;border-radius:18px;border:0;background:#FFD54A;color:#12201B;font-weight:700;font-size:17px">Next step</button>
</div>

</div>
</x-dc>
</body></html>
