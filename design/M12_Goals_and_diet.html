<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Goals and diet</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#12201B;font-family:'DM Sans',system-ui,sans-serif;color:#F4EFE6}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;margin:0}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #FFD54A;outline-offset:3px}
input[type=checkbox]{accent-color:#FF5A36;width:28px;height:28px;margin:0;flex:none}
</style>
</helmet>

<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#12201B">

<div style="position:absolute;left:0;right:0;top:0;padding:20px 16px 0;display:flex;align-items:center;gap:12px">
<a href="Board.dc.html" aria-label="Back to the board" style="width:48px;height:48px;border-radius:50%;background:#1B2D26;border:2px solid #2E4439;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="font-size:28px;font-weight:800;letter-spacing:-0.8px;line-height:1">Goals and diet</h1>
</div>

<div style="position:absolute;left:16px;right:16px;top:88px;display:flex;flex-direction:column;gap:14px">

<div style="border-radius:24px;background:#1B2D26;border:2px solid #2E4439;padding:16px">
<p style="font-weight:800;font-size:18px;font-family:'Bricolage Grotesque',sans-serif">Daily goals</p>
<div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
<span style="font-weight:700;font-size:16px">Calories</span>
<div style="display:flex;align-items:center;gap:8px">
<button aria-label="Lower the calorie goal" style="width:44px;height:44px;border-radius:12px;border:2px solid #F4EFE6;background:transparent;color:#F4EFE6;font-weight:700;font-size:20px">-</button>
<span style="font-weight:800;font-size:18px;min-width:84px;text-align:center">2,000 kcal</span>
<button aria-label="Raise the calorie goal" style="width:44px;height:44px;border-radius:12px;border:2px solid #F4EFE6;background:transparent;color:#F4EFE6;font-weight:700;font-size:20px">+</button>
</div>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
<span style="font-weight:700;font-size:16px">Protein</span>
<div style="display:flex;align-items:center;gap:8px">
<button aria-label="Lower the protein goal" style="width:44px;height:44px;border-radius:12px;border:2px solid #F4EFE6;background:transparent;color:#F4EFE6;font-weight:700;font-size:20px">-</button>
<span style="font-weight:800;font-size:18px;min-width:84px;text-align:center">120 g</span>
<button aria-label="Raise the protein goal" style="width:44px;height:44px;border-radius:12px;border:2px solid #F4EFE6;background:transparent;color:#F4EFE6;font-weight:700;font-size:20px">+</button>
</div>
</div>
</div>

<div style="border-radius:24px;background:#1B2D26;border:2px solid #2E4439;padding:16px">
<p style="font-weight:800;font-size:18px;font-family:'Bricolage Grotesque',sans-serif">Dietary needs</p>
<p style="font-size:13px;color:#B8C5BD;margin-top:2px">Applied to every recipe and swap.</p>
<div style="display:flex;flex-direction:column;gap:2px;margin-top:6px">
<label style="display:flex;align-items:center;justify-content:space-between;min-height:48px;font-weight:700;font-size:16px">Vegetarian<input type="checkbox"></label>
<label style="display:flex;align-items:center;justify-content:space-between;min-height:48px;font-weight:700;font-size:16px">Gluten-free<input type="checkbox"></label>
<label style="display:flex;align-items:center;justify-content:space-between;min-height:48px;font-weight:700;font-size:16px">Nut-free<input type="checkbox" checked=""></label>
<label style="display:flex;align-items:center;justify-content:space-between;min-height:48px;font-weight:700;font-size:16px">Dairy-free<input type="checkbox"></label>
</div>
</div>

<div style="border-radius:24px;background:#1B2D26;border:2px solid #2E4439;padding:16px">
<p style="font-weight:800;font-size:18px;font-family:'Bricolage Grotesque',sans-serif">Allergies</p>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
<span style="min-height:44px;padding:0 14px;display:flex;align-items:center;gap:8px;border-radius:999px;background:#F4EFE6;color:#12201B;font-weight:700;font-size:15px">Peanuts</span>
<span style="min-height:44px;padding:0 14px;display:flex;align-items:center;gap:8px;border-radius:999px;background:#F4EFE6;color:#12201B;font-weight:700;font-size:15px">Shellfish</span>
<button style="min-height:44px;padding:0 14px;display:flex;align-items:center;gap:6px;border-radius:999px;border:2px dashed #B8C5BD;background:transparent;color:#F4EFE6;font-weight:700;font-size:15px">Add</button>
</div>
</div>

<div style="border-radius:24px;background:#1B2D26;border:2px solid #2E4439;padding:8px 16px">
<label style="display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:64px;font-size:16px;font-weight:700"><span>Demo mode<span style="display:block;font-size:13px;font-weight:400;color:#B8C5BD;margin-top:2px">Use saved results for the demo photos</span></span><input type="checkbox"></label>
</div>

</div>

</div>
</x-dc>
</body></html>
