<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Shopping list</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#12201B;font-family:'DM Sans',system-ui,sans-serif;color:#F4EFE6}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;margin:0}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #FFD54A;outline-offset:3px}
input[type=checkbox]{accent-color:#FF5A36;width:26px;height:26px;margin:0;flex:none}
</style>
</helmet>

<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#12201B">

<div style="position:absolute;left:0;right:0;top:0;padding:20px 16px 0;display:flex;align-items:center;gap:12px">
<a href="Sticker.dc.html" aria-label="Back to the sticker" style="width:48px;height:48px;border-radius:50%;background:#1B2D26;border:2px solid #2E4439;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div>
<h1 style="font-size:28px;font-weight:800;letter-spacing:-0.8px;line-height:1">Shopping list</h1>
<p style="font-size:14px;color:#B8C5BD;margin-top:4px">Cacio e Pepe, serves 2</p>
</div>
</div>

<div style="position:absolute;left:16px;right:16px;top:96px">

<p style="font-weight:700;font-size:14px;color:#FFD54A;margin-bottom:8px">Pasta and pantry</p>
<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
<li><label style="display:flex;align-items:center;gap:14px;min-height:60px;box-sizing:border-box;padding:0 16px;border-radius:18px;background:#1B2D26;border:2px solid #2E4439;font-size:16px;font-weight:700"><input type="checkbox"><span style="flex:1">Spaghetti</span><span style="font-weight:500;color:#B8C5BD">200 g</span><span style="min-width:48px;text-align:right">$1.80</span></label></li>
<li><label style="display:flex;align-items:center;gap:14px;min-height:60px;box-sizing:border-box;padding:0 16px;border-radius:18px;background:#1B2D26;border:2px solid #2E4439;font-size:16px;font-weight:700"><input type="checkbox" checked=""><span style="flex:1;text-decoration:line-through;color:#B8C5BD">Black pepper</span><span style="font-weight:500;color:#B8C5BD">1 tsp</span><span style="min-width:48px;text-align:right;color:#B8C5BD">$0.40</span></label></li>
</ul>

<p style="font-weight:700;font-size:14px;color:#FFD54A;margin:20px 0 8px">Dairy</p>
<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
<li><label style="display:flex;align-items:center;gap:14px;min-height:60px;box-sizing:border-box;padding:0 16px;border-radius:18px;background:#1B2D26;border:2px solid #2E4439;font-size:16px;font-weight:700"><input type="checkbox"><span style="flex:1">Pecorino Romano</span><span style="font-weight:500;color:#B8C5BD">80 g</span><span style="min-width:48px;text-align:right">$5.00</span></label></li>
<li><label style="display:flex;align-items:center;gap:14px;min-height:60px;box-sizing:border-box;padding:0 16px;border-radius:18px;background:#1B2D26;border:2px solid #2E4439;font-size:16px;font-weight:700"><input type="checkbox"><span style="flex:1">Butter</span><span style="font-weight:500;color:#B8C5BD">20 g</span><span style="min-width:48px;text-align:right">$0.60</span></label></li>
</ul>

<p style="font-size:13px;line-height:1.4;color:#B8C5BD;margin-top:16px">Prices are estimates from a category table, not live store prices. Pasta water is free.</p>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:16px 16px 28px;background:#1B2D26;border-top:2px solid #2E4439">
<div style="display:flex;justify-content:space-between;align-items:baseline">
<p style="font-size:15px;color:#B8C5BD">Estimated total</p>
<p style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;line-height:1">$7.80</p>
</div>
<p style="font-size:14px;color:#FFD54A;margin-top:4px;text-align:right">At the restaurant: $50.00</p>
<div style="display:flex;gap:10px;margin-top:14px">
<button style="flex:1;min-height:56px;border-radius:18px;border:0;background:#FF5A36;color:#12201B;font-weight:700;font-size:16px">Copy list</button>
<button style="flex:1;min-height:56px;border-radius:18px;border:2px solid #F4EFE6;background:transparent;color:#F4EFE6;font-weight:700;font-size:16px">Share list</button>
</div>
</div>

</div>
</x-dc>
</body></html>
